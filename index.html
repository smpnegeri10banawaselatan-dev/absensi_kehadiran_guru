<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Guru - SMP Negeri 1 Sintuvu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-6">

  <!-- Header Sekolah -->
  <div class="text-center mb-6">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6d/Logo_Sekolah.png" alt="Logo Sekolah" class="mx-auto w-20 h-20 mb-2 rounded-full border shadow-md">
    <h1 class="text-xl font-bold text-blue-800 uppercase tracking-wide">SMP Negeri 1 Sintuvu</h1>
    <p class="text-gray-600 text-sm">Jl. Pendidikan No. 123, Kecamatan Sintuvu, Kabupaten Donggala</p>
  </div>

  <!-- Card Form Absensi -->
  <div class="w-full max-w-3xl bg-white p-6 rounded-2xl shadow-lg">
    <h2 class="text-2xl font-bold text-center mb-4 text-blue-700">📋 Form Absensi Guru</h2>

    <form id="attendanceForm" class="space-y-4">
      <!-- Nama Guru -->
      <div>
        <label class="block text-gray-700 font-semibold">Nama Guru</label>
        <select id="teacherSelect" class="form-select border-gray-300 rounded-lg w-full p-2">
          <option value="">Pilih Guru</option>
        </select>
      </div>

      <!-- NIP -->
      <div>
        <label class="block text-gray-700 font-semibold">NIP</label>
        <input type="text" id="nip" class="form-control" readonly>
      </div>

      <!-- Mata Pelajaran -->
      <div>
        <label class="block text-gray-700 font-semibold">Mata Pelajaran</label>
        <input type="text" id="subject" class="form-control" readonly>
      </div>

      <!-- Kelas -->
      <div>
        <label class="block text-gray-700 font-semibold">Kelas</label>
        <select id="class" class="form-select border-gray-300 rounded-lg w-full p-2" required>
          <option value="">Pilih Kelas</option>
          <option value="VII">Kelas VII</option>
          <option value="VIII">Kelas VIII</option>
          <option value="IX">Kelas IX</option>
        </select>
      </div>

      <!-- Topik Pembelajaran -->
      <div>
        <label class="block text-gray-700 font-semibold">Topik Pembelajaran</label>
        <input type="text" id="topic" class="form-control" placeholder="Masukkan topik hari ini" required>
      </div>

      <!-- Jumlah Kehadiran -->
      <div>
        <label class="block text-gray-700 font-semibold">Jumlah Kehadiran Siswa</label>
        <input type="number" id="presentCount" class="form-control" placeholder="Contoh: 30" required>
      </div>

      <!-- Foto -->
      <div>
        <label class="block text-gray-700 font-semibold">Foto Dokumentasi</label>
        <input type="file" id="photo" accept="image/*" capture="camera" class="form-control" required>
      </div>

      <!-- Lokasi -->
      <div>
        <label class="block text-gray-700 font-semibold">Lokasi</label>
        <p id="location" class="text-gray-600 text-sm">Menunggu lokasi...</p>
      </div>

      <!-- Tombol Kirim -->
      <div class="text-center">
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg transition">Kirim Absensi</button>
      </div>
    </form>

    <!-- Status -->
    <div id="status" class="mt-4 text-center text-green-600 font-medium hidden">✅ Absensi berhasil dikirim!</div>
  </div>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbwo9OvfS6w_8fN2T-yBm5Mr4B3U-PMCdMCn52rgjj2mUkUYbSfZ7y53PgcSpsGBiSMBXg/exec"; // Ganti dengan URL Web App Apps Script kamu
    let latitude = "", longitude = "";

    // ✅ Ambil lokasi otomatis
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => {
          latitude = pos.coords.latitude;
          longitude = pos.coords.longitude;
          document.getElementById("location").textContent = `📍 ${latitude}, ${longitude}`;
        },
        err => {
          document.getElementById("location").textContent = "Tidak dapat mengakses lokasi.";
        }
      );
    }

    // ✅ Ambil daftar guru dari Spreadsheet
    fetch(`${scriptURL}?action=getTeachers`)
      .then(res => res.json())
      .then(data => {
        const select = document.getElementById("teacherSelect");
        data.forEach(t => {
          const option = document.createElement("option");
          option.value = t.name;
          option.textContent = `${t.name} (${t.subject})`;
          option.dataset.nip = t.nip;
          option.dataset.subject = t.subject;
          select.appendChild(option);
        });
      });

    // ✅ Isi otomatis NIP dan mapel
    document.getElementById("teacherSelect").addEventListener("change", e => {
      const opt = e.target.selectedOptions[0];
      document.getElementById("nip").value = opt.dataset.nip || "";
      document.getElementById("subject").value = opt.dataset.subject || "";
    });

    // ✅ Kirim absensi
    document.getElementById("attendanceForm").addEventListener("submit", async e => {
      e.preventDefault();

      const file = document.getElementById("photo").files[0];
      const reader = new FileReader();
      reader.onloadend = async () => {
        const data = [{
          name: document.getElementById("teacherSelect").value,
          nip: document.getElementById("nip").value,
          subject: document.getElementById("subject").value,
          class: document.getElementById("class").value,
          topic: document.getElementById("topic").value,
          presentCount: document.getElementById("presentCount").value,
          latitude,
          longitude,
          photo: reader.result
        }];

        const response = await fetch(scriptURL, {
          method: "POST",
          body: JSON.stringify(data)
        });

        const result = await response.json();
        if (result.status === "Success") {
          document.getElementById("status").classList.remove("hidden");
          e.target.reset();
        }
      };
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
