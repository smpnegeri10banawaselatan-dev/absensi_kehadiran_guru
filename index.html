<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Absensi Guru - MKKS ROSO NU SINTUVU</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background-color: #f3f4f6; }
    video, canvas { width: 100%; border-radius: 10px; }
    .logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
      border-radius: 50%;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

  <div class="bg-white p-6 rounded-2xl shadow-lg w-full max-w-lg">
    <!-- 🏫 Header Sekolah -->
    <div class="text-center mb-6">
      <img src="smpn10.jpg" alt="Logo Sekolah" class="logo mx-auto mb-2">
      <h2 class="text-lg font-bold text-blue-800">SMP NEGERI 10 BANAWA SELATAN</h2>
      <h3 class="text-sm text-gray-600">Jl. Jalan PNPM Dusun III Desa Malino,Kec.Banawa Selatan - Kab.Donggala Sulawesi Tengah</h3>
      <h4 class="text-xs text-gray-500 italic">E-mail: smpnegeri10banawaselatan@gmail.com | Telp: - </h4>
      <hr class="mt-3 mb-2 border-blue-400">
      <h1 class="text-xl font-bold text-blue-700">📋 ABSENSI KEHADIRAN GURU</h1>
    </div>

    <!-- Form Absensi -->
    <form id="attendanceForm" class="space-y-3">
      <div>
        <label class="font-semibold">Nama Guru</label>
        <select id="teacherSelect" class="form-select" required>
          <option value="">Pilih Guru...</option>
        </select>
      </div>

      <div>
        <label class="font-semibold">Kelas</label>
        <input type="text" id="kelas" class="form-control" placeholder="Contoh: 7A" required>
      </div>

      <div>
        <label class="font-semibold">Topik/Kegiatan</label>
        <input type="text" id="topic" class="form-control" placeholder="Contoh: Pengantar Informatika" required>
      </div>

      <div>
        <label class="font-semibold">Jumlah Hadir</label>
        <input type="number" id="presentCount" class="form-control" min="0" placeholder="Misal: 25" required>
      </div>

      <!-- Lokasi -->
      <div class="flex space-x-2">
        <input type="text" id="latitude" class="form-control" placeholder="Latitude" readonly>
        <input type="text" id="longitude" class="form-control" placeholder="Longitude" readonly>
      </div>
      <button type="button" class="btn btn-secondary w-full" onclick="getLocation()">📍 Ambil Lokasi</button>

      <!-- Kamera -->
      <div>
        <label class="font-semibold">Foto Kehadiran</label>
        <video id="camera" autoplay playsinline></video>
        <button type="button" class="btn btn-outline-primary w-full mt-2" onclick="capturePhoto()">📸 Ambil Foto</button>
        <canvas id="snapshot" class="mt-2 hidden"></canvas>
      </div>

      <button type="submit" class="btn btn-primary w-full mt-3">✅ Simpan Absensi</button>
    </form>

    <p id="statusMsg" class="text-center text-green-600 font-semibold mt-3"></p>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyG9JBTJSD7JgbOLUnsLFdIRj60cECvfp37Fk8D9siFvmgb_hWRVHcpEwImptPA8PQmQQ/exec'; 
    // 🟢 Ganti dengan URL Web App Apps Script kamu

    let photoData = "";

    // --- Ambil daftar guru ---
    async function loadTeachers() {
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getTeachers`);
        const data = await res.json();
        const select = document.getElementById('teacherSelect');
        data.forEach(t => {
          const opt = document.createElement('option');
          opt.value = JSON.stringify(t);
          opt.textContent = `${t.name} (${t.subject})`;
          select.appendChild(opt);
        });
      } catch (error) {
        alert("Gagal memuat daftar guru. Periksa koneksi atau Apps Script URL.");
      }
    }

    // --- Kamera ---
    async function startCamera() {
      const video = document.getElementById('camera');
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
      } catch (err) {
        alert('Gagal mengakses kamera: ' + err.message);
      }
    }

    function capturePhoto() {
      const video = document.getElementById('camera');
      const canvas = document.getElementById('snapshot');
      const context = canvas.getContext('2d');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      context.drawImage(video, 0, 0, canvas.width, canvas.height);
      photoData = canvas.toDataURL('image/png');
      canvas.classList.remove('hidden');
      alert('📷 Foto berhasil diambil!');
    }

    // --- Lokasi ---
    function getLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          document.getElementById('latitude').value = pos.coords.latitude;
          document.getElementById('longitude').value = pos.coords.longitude;
        }, err => alert('Gagal ambil lokasi: ' + err.message));
      } else {
        alert('Geolocation tidak didukung di browser ini.');
      }
    }

    // --- Kirim ke Apps Script ---
    document.getElementById('attendanceForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const selected = JSON.parse(document.getElementById('teacherSelect').value);
      const payload = [{
        name: selected.name,
        nip: selected.nip,
        subject: selected.subject,
        kelas: document.getElementById('kelas').value,
        topic: document.getElementById('topic').value,
        presentCount: document.getElementById('presentCount').value,
        latitude: document.getElementById('latitude').value,
        longitude: document.getElementById('longitude').value,
        photo: photoData
      }];

      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload),
        headers: { 'Content-Type': 'application/json' }
      });

      const result = await res.json();
      if (result.status === 'Success') {
        document.getElementById('statusMsg').innerText = '✅ Absensi berhasil disimpan!';
        e.target.reset();
        photoData = "";
      } else {
        alert('❌ Gagal menyimpan absensi!');
      }
    });

    // --- Init ---
    loadTeachers();
    startCamera();
  </script>
</body>
</html>
